name: Feature request
description: An idea to make Tracket more useful
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The need first, the solution second.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Tracket to do?
    validations:
      required: false
